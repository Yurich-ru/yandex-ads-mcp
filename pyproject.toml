[project]
name = "yandex-ads-mcp"
version = "1.3.1"
description = "MCP server for Yandex Direct, Yandex Metrika, Yandex Audience, and Wordstat APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["server", "tools_metrika", "tools_audience", "tools_direct_extra"]

[project.scripts]
yandex-ads-mcp = "server:main_sync"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
