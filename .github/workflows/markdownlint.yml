name: markdownlint

on:
  pull_request:
    paths: ['**.md', '.github/workflows/markdownlint.yml']
  push:
    branches: [master]
    paths: ['**.md', '.github/workflows/markdownlint.yml']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
